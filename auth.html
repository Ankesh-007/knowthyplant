<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowThyPlant - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-container">
        <h1>🌱 KnowThyPlant</h1>
        <p class="auth-subtitle">Identify plants with your camera</p>

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-signin" onclick="showTab('signin')">Sign In</button>
                <button class="auth-tab" id="tab-signup" onclick="showTab('signup')">Sign Up</button>
            </div>

            <form id="signin-form" class="auth-form" onsubmit="handleSignIn(event)">
                <input type="email" id="signin-email" placeholder="Email" required>
                <input type="password" id="signin-password" placeholder="Password" required>
                <button type="submit" class="auth-btn">Sign In</button>
                <a href="#" class="auth-link" onclick="showTab('reset')">Forgot password?</a>
            </form>

            <form id="signup-form" class="auth-form hidden" onsubmit="handleSignUp(event)">
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password (min 6 characters)" minlength="6" required>
                <input type="password" id="signup-confirm" placeholder="Confirm Password" minlength="6" required>
                <button type="submit" class="auth-btn">Sign Up</button>
            </form>

            <form id="reset-form" class="auth-form hidden" onsubmit="handleReset(event)">
                <p class="auth-info">Enter your email to receive a password reset link.</p>
                <input type="email" id="reset-email" placeholder="Email" required>
                <button type="submit" class="auth-btn">Send Reset Link</button>
                <a href="#" class="auth-link" onclick="showTab('signin')">Back to Sign In</a>
            </form>

            <div id="auth-message" class="auth-message hidden"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>

</html>
