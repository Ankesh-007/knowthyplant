<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Plant Identifier</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🌱 Plant Identification</h1>

    <video id="video" autoplay></video>
    <button id="capture">Capture Plant</button>

    <canvas id="canvas" hidden></canvas>

    <div id="result">
        <h2>Plant Details</h2>
        <p id="plant-name"></p>
        <p id="plant-desc"></p>
        <p id="plant-confidence"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
